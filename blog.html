<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blog Details | My Blog</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "ui-sans-serif", "system-ui"]
                    }
                }
            }
        }
    </script>
</head>


<body class="min-h-screen bg-slate-50 text-slate-800 font-sans">


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header
        class="sticky top-0 z-50
               bg-white/90 backdrop-blur-xl
               border-b border-slate-200/70"
    >

        <nav
            class="max-w-none w-full mx-auto
                   h-20
                   px-5 sm:px-6 lg:px-8
                   flex items-center
                   justify-between"
        >

            <!-- Logo -->

            <a
                href="index.html"
                class="flex items-center gap-3 group"
            >

                <div
                    class="w-10 h-10
                           rounded-xl
                           bg-slate-900
                           flex items-center
                           justify-center
                           shadow-md
                           group-hover:bg-indigo-600
                           transition"
                >

                    <span
                        class="text-white
                               font-black
                               text-lg"
                    >
                        M
                    </span>

                </div>


                <div>

                    <h1
                        class="text-xl
                               font-extrabold
                               tracking-tight
                               text-slate-900"
                    >
                        My Blog
                    </h1>

                    <p
                        class="hidden sm:block
                               text-[10px]
                               uppercase
                               tracking-[0.2em]
                               text-slate-400"
                    >
                        Stories & Ideas
                    </p>

                </div>

            </a>


            <!-- Navigation -->

            <div
                class="flex items-center
                       gap-2 sm:gap-5"
            >

                <a
                    href="index.html"
                    class="hidden sm:block
                           text-sm
                           font-medium
                           text-slate-500
                           hover:text-indigo-600
                           transition"
                >
                    Home
                </a>


                <a
                    href="dashboard.html"
                    class="hidden sm:block
                           text-sm
                           font-medium
                           text-slate-500
                           hover:text-indigo-600
                           transition"
                >
                    Dashboard
                </a>


                <a
                    href="login.html"
                    class="inline-flex
                           items-center
                           justify-center
                           px-4 sm:px-5
                           py-2.5
                           rounded-xl
                           bg-slate-900
                           text-white
                           text-sm
                           font-semibold
                           shadow-md
                           hover:bg-indigo-600
                           hover:-translate-y-0.5
                           transition-all"
                >
                    Login
                </a>

            </div>

        </nav>

    </header>



    <!-- =====================================================
         HERO
    ====================================================== -->

    <section
        class="relative
               overflow-hidden
               bg-slate-950"
    >

        <!-- Background -->

        <div
            class="absolute inset-0
                   bg-gradient-to-br
                   from-indigo-950
                   via-slate-950
                   to-purple-950"
        ></div>


        <!-- Glow -->

        <div
            class="absolute
                   -top-32
                   -right-20
                   w-96 h-96
                   rounded-full
                   bg-indigo-600/20
                   blur-3xl"
        ></div>


        <div
            class="absolute
                   -bottom-40
                   -left-20
                   w-96 h-96
                   rounded-full
                   bg-purple-600/20
                   blur-3xl"
        ></div>


        <div
            class="relative z-10
                   max-w-5xl mx-auto
                   px-5 sm:px-6
                   py-14 sm:py-16"
        >

            <div
                class="max-w-3xl"
            >

                <!-- Badge -->

                <span
                    class="inline-flex
                           items-center
                           gap-2
                           px-4 py-2
                           rounded-full
                           border border-white/10
                           bg-white/5
                           text-indigo-300
                           text-sm
                           font-medium"
                >

                    <span>📖</span>

                    Blog Article

                </span>


                <!-- Heading -->

                <h1
                    class="mt-6
                           text-4xl
                           sm:text-5xl
                           lg:text-6xl
                           font-extrabold
                           tracking-tight
                           text-white"
                >
                    Explore the Story
                </h1>


                <p
                    class="mt-5
                           text-lg
                           leading-8
                           text-slate-300
                           max-w-2xl"
                >
                    Discover ideas, knowledge and stories
                    written by our community.
                </p>

            </div>

        </div>

    </section>



    <!-- =====================================================
         BLOG DETAILS
    ====================================================== -->

    <main
        class="max-w-5xl mx-auto
               px-5 sm:px-6
               py-10 sm:py-14"
    >

        <!-- Back Button -->

        <div class="mb-6">

            <a
                href="index.html"
                class="inline-flex
                       items-center
                       gap-2
                       text-sm
                       font-semibold
                       text-slate-500
                       hover:text-indigo-600
                       transition"
            >
                <span>←</span>
                Back to Blogs
            </a>

        </div>


        <!-- Article -->

        <article
            id="blogDetails"
            class="bg-white
                   rounded-[28px]
                   border border-slate-200
                   shadow-[0_20px_60px_-20px_rgba(15,23,42,0.16)]
                   overflow-hidden"
        >

            <!-- JavaScript will insert blog details -->

        </article>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer
        class="mt-10
               bg-slate-950
               text-slate-400"
    >

        <div
            class="max-w-none w-full mx-auto
                   px-5 sm:px-6 lg:px-8
                   py-10"
        >

            <div
                class="flex flex-col
                       sm:flex-row
                       items-center
                       justify-between
                       gap-5"
            >

                <!-- Brand -->

                <div
                    class="flex items-center
                           gap-3"
                >

                    <div
                        class="w-9 h-9
                               rounded-lg
                               bg-indigo-600
                               flex items-center
                               justify-center"
                    >

                        <span
                            class="text-white
                                   font-black"
                        >
                            M
                        </span>

                    </div>


                    <div>

                        <p
                            class="font-bold
                                   text-white"
                        >
                            My Blog
                        </p>

                        <p
                            class="text-xs
                                   text-slate-500"
                        >
                            Read. Write. Inspire.
                        </p>

                    </div>

                </div>


                <!-- Copyright -->

                <p class="text-sm">

                    © 2026 My Blog.
                    All rights reserved.

                </p>

            </div>

        </div>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/script.js"></script>

</body>

</html>
