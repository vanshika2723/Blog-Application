
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blog Details - My Blog</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-50 text-gray-800">

    <!-- Navbar -->

    <header class="bg-white shadow-sm">

        <nav
            class="max-w-7xl mx-auto px-6 py-4
                   flex flex-col md:flex-row
                   items-center justify-between gap-4"
        >

            <a
                href="index.html"
                class="text-2xl font-bold text-blue-600"
            >
                My Blog
            </a>

            <div class="flex flex-wrap
                        items-center justify-center gap-5">

                <a
                    href="index.html"
                    class="text-gray-600
                           hover:text-blue-600
                           transition font-medium"
                >
                    Home
                </a>

                <a
                    href="dashboard.html"
                    class="text-gray-600
                           hover:text-blue-600
                           transition font-medium"
                >
                    Dashboard
                </a>

                <a
                    href="login.html"
                    class="text-gray-600
                           hover:text-blue-600
                           transition font-medium"
                >
                    Login
                </a>

            </div>

        </nav>

    </header>


    <!-- Blog Details -->

    <main
        class="max-w-4xl mx-auto
               px-6 py-12"
    >

        <article
            id="blogDetails"
            class="bg-white rounded-2xl
                   shadow-sm
                   border border-gray-100
                   p-6 md:p-10"
        >

            <!-- JavaScript will insert blog details here -->

        </article>

    </main>


    <!-- Footer -->

    <footer
        class="bg-gray-900
               text-gray-300 mt-10"
    >

        <div
            class="max-w-7xl mx-auto
                   px-6 py-6 text-center"
        >

            <p>
                &copy; 2026 My Blog.
                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- Existing JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
