
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - My Blog</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-50 text-gray-800">

    <!-- Navbar -->

    <header class="bg-white shadow-sm">

        <nav
            class="max-w-7xl mx-auto px-6 py-4
                   flex flex-col md:flex-row
                   items-center justify-between gap-4"
        >

            <a
                href="index.html"
                class="text-2xl font-bold text-blue-600"
            >
                My Blog
            </a>

            <div class="flex items-center gap-5">

                <a
                    href="index.html"
                    class="text-gray-600
                           hover:text-blue-600
                           transition"
                >
                    Home
                </a>

                <a
                    href="create-blog.html"
                    class="bg-blue-600 text-white
                           px-4 py-2 rounded-lg
                           hover:bg-blue-700
                           transition"
                >
                    Create Blog
                </a>

                <button
                    id="logoutBtn"
                    class="text-red-500
                           hover:text-red-700
                           font-medium transition"
                >
                    Logout
                </button>

            </div>

        </nav>

    </header>


    <!-- Main -->

    <main
        class="max-w-7xl mx-auto
               px-6 py-10"
    >

        <!-- Welcome -->

        <div class="mb-10">

            <h1
                id="welcomeMessage"
                class="text-3xl md:text-4xl
                       font-bold text-gray-900"
            >
                Welcome back!
            </h1>

            <p class="text-gray-500 mt-2">
                Manage your blogs and track your content.
            </p>

        </div>


        <!-- Statistics -->

        <section
            class="grid grid-cols-1
                   sm:grid-cols-2
                   lg:grid-cols-3
                   gap-6 mb-10"
        >

            <!-- Total Blogs -->

            <div
                class="bg-white rounded-xl
                       shadow-sm p-6
                       border border-gray-100"
            >

                <p class="text-gray-500 text-sm">
                    Total Blogs
                </p>

                <h2
                    id="totalBlogs"
                    class="text-3xl font-bold
                           text-gray-900 mt-2"
                >
                    0
                </h2>

            </div>


            <!-- Published -->

            <div
                class="bg-white rounded-xl
                       shadow-sm p-6
                       border border-gray-100"
            >

                <p class="text-gray-500 text-sm">
                    Published Blogs
                </p>

                <h2
                    id="publishedBlogs"
                    class="text-3xl font-bold
                           text-green-600 mt-2"
                >
                    0
                </h2>

            </div>


            <!-- Drafts -->

            <div
                class="bg-white rounded-xl
                       shadow-sm p-6
                       border border-gray-100"
            >

                <p class="text-gray-500 text-sm">
                    Draft Blogs
                </p>

                <h2
                    id="draftBlogs"
                    class="text-3xl font-bold
                           text-orange-500 mt-2"
                >
                    0
                </h2>

            </div>

        </section>


        <!-- Blogs Section -->

        <section>

            <div
                class="flex flex-col sm:flex-row
                       items-start sm:items-center
                       justify-between gap-4 mb-6"
            >

                <div>

                    <h2
                        class="text-2xl font-bold
                               text-gray-900"
                    >
                        My Blogs
                    </h2>

                    <p class="text-gray-500 mt-1">
                        View and manage your published blogs.
                    </p>

                </div>


                <a
                    href="create-blog.html"
                    class="bg-blue-600 text-white
                           px-5 py-2.5 rounded-lg
                           font-medium
                           hover:bg-blue-700
                           transition"
                >
                    + Create New Blog
                </a>

            </div>


            <!-- JavaScript inserts blogs here -->

            <div
                id="dashboardBlogList"
                class="grid grid-cols-1
                       md:grid-cols-2
                       lg:grid-cols-3
                       gap-6"
            >
            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer
        class="bg-gray-900 text-gray-300
               mt-10"
    >

        <div
            class="max-w-7xl mx-auto
                   px-6 py-6 text-center"
        >

            <p>
                &copy; 2026 My Blog.
                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- Existing JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
