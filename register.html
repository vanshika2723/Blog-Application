
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - My Blog</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="min-h-screen bg-gray-50
           flex items-center justify-center
           px-4 py-8"
>

    <!-- Register Container -->

    <div class="w-full max-w-md">

        <!-- Heading -->

        <div class="text-center mb-8">

            <a
                href="index.html"
                class="text-3xl font-bold text-blue-600"
            >
                My Blog
            </a>

            <h1
                class="text-2xl font-bold
                       text-gray-900 mt-6"
            >
                Create Your Account
            </h1>

            <p class="text-gray-500 mt-2">
                Join our blogging community today
            </p>

        </div>


        <!-- Register Card -->

        <div
            class="bg-white rounded-2xl
                   shadow-lg p-8"
        >

            <form id="registerForm">

                <!-- Name -->

                <div class="mb-5">

                    <label
                        for="name"
                        class="block text-sm
                               font-medium
                               text-gray-700 mb-2"
                    >
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                        class="w-full px-4 py-3
                               border border-gray-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:border-blue-500"
                    >

                </div>


                <!-- Email -->

                <div class="mb-5">

                    <label
                        for="registerEmail"
                        class="block text-sm
                               font-medium
                               text-gray-700 mb-2"
                    >
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                        class="w-full px-4 py-3
                               border border-gray-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:border-blue-500"
                    >

                </div>


                <!-- Password -->

                <div class="mb-5">

                    <label
                        for="registerPassword"
                        class="block text-sm
                               font-medium
                               text-gray-700 mb-2"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                        class="w-full px-4 py-3
                               border border-gray-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:border-blue-500"
                    >

                    <p class="text-xs text-gray-400 mt-2">
                        Password must contain at least 6 characters.
                    </p>

                </div>


                <!-- Confirm Password -->

                <div class="mb-5">

                    <label
                        for="confirmPassword"
                        class="block text-sm
                               font-medium
                               text-gray-700 mb-2"
                    >
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                        class="w-full px-4 py-3
                               border border-gray-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:border-blue-500"
                    >

                </div>


                <!-- Error -->

                <p
                    id="registerError"
                    class="text-red-500 text-sm
                           mb-4 min-h-[20px]"
                ></p>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="w-full bg-blue-600
                           text-white py-3
                           rounded-lg
                           font-semibold
                           hover:bg-blue-700
                           hover:-translate-y-0.5
                           transition
                           shadow-md"
                >
                    Create Account
                </button>

            </form>


            <!-- Login Link -->

            <p
                class="text-center text-gray-500
                       text-sm mt-6"
            >
                Already have an account?

                <a
                    href="login.html"
                    class="text-blue-600
                           font-semibold
                           hover:underline"
                >
                    Login
                </a>

            </p>

        </div>


        <!-- Back Home -->

        <div class="text-center mt-6">

            <a
                href="index.html"
                class="text-gray-500
                       hover:text-blue-600
                       text-sm transition"
            >
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- Existing JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
