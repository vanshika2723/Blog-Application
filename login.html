
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - My Blog</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="min-h-screen bg-gray-50
           flex items-center justify-center
           px-4"
>

    <!-- Login Card -->
    <div class="w-full max-w-md">

        <!-- Logo / Heading -->
        <div class="text-center mb-8">

            <a
                href="index.html"
                class="text-3xl font-bold text-blue-600"
            >
                My Blog
            </a>

            <h1
                class="text-2xl font-bold
                       text-gray-900 mt-6"
            >
                Welcome Back
            </h1>

            <p class="text-gray-500 mt-2">
                Login to continue to your account
            </p>

        </div>


        <!-- Form Card -->
        <div
            class="bg-white rounded-2xl shadow-lg
                   p-8"
        >

            <form id="loginForm">

                <!-- Email -->
                <div class="mb-5">

                    <label
                        for="email"
                        class="block text-sm
                               font-medium text-gray-700
                               mb-2"
                    >
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                        class="w-full px-4 py-3
                               border border-gray-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:border-blue-500"
                    >

                </div>


                <!-- Password -->
                <div class="mb-5">

                    <label
                        for="password"
                        class="block text-sm
                               font-medium text-gray-700
                               mb-2"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        class="w-full px-4 py-3
                               border border-gray-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:border-blue-500"
                    >

                </div>


                <!-- Error -->
                <p
                    id="loginError"
                    class="text-red-500 text-sm
                           mb-4 min-h-[20px]"
                ></p>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full bg-blue-600
                           text-white py-3
                           rounded-lg
                           font-semibold
                           hover:bg-blue-700
                           hover:-translate-y-0.5
                           transition
                           shadow-md"
                >
                    Login
                </button>

            </form>


            <!-- Register Link -->
            <p
                class="text-center text-gray-500
                       text-sm mt-6"
            >
                Don't have an account?

                <a
                    href="register.html"
                    class="text-blue-600
                           font-semibold
                           hover:underline"
                >
                    Register
                </a>

            </p>

        </div>


        <!-- Back Home -->
        <div class="text-center mt-6">

            <a
                href="index.html"
                class="text-gray-500
                       hover:text-blue-600
                       text-sm transition"
            >
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- Existing JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
